
name: les-magento

services:
  nginx:
    image: nginx:1.24.0
    ports:
      - "127.0.0.1:${NGINX_PORT:-18080}:80"
    volumes:
      - ./src:/var/www/html
      - magento_vendor:/var/www/html/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
  
  nginx-hk:
    image: nginx:1.24.0
    ports:
      - "127.0.0.1:${NGINX_HK_PORT:-18080}:80"
    volumes:
      - ./src:/var/www/html
      - magento_vendor:/var/www/html/vendor:ro
      - ./docker/nginx/hk.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    image: taii0401/magento-php:8.3.6
    volumes:
      - ./src:/var/www/html
      - magento_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      opensearch:
        condition: service_started

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=SOCKET -u magento -D magento -e "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    command:
      - --log-bin-trust-function-creators=1

  redis:
    image: redis:7.0.15
    volumes:
      - redisdata:/data

  opensearch:
    image: opensearchproject/opensearch:2.19.7
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearchdata:/usr/share/opensearch/data

  node:
    image: node:20.20.2
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    profiles:
      - tools
    command: ["sleep", "infinity"]

volumes:
  mysql_data:
  redisdata:
  opensearchdata:
  magento_vendor:
